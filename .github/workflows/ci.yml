# SupportLens CI Pipeline
# Runs on every push and pull request
# 
# Pipeline stages:
# 1. Lint - Fast code quality checks (fails fast)
# 2. Build - Docker image builds (parallel)
# 3. E2E Test - Full integration tests with real HTTP requests

name: CI Pipeline

on:
  push:
    branches: [main, feature/*, health-endpoint]
  pull_request:
    branches: [main, health-endpoint]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use consistent Python version across jobs
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ==========================================================================
  # Stage 1: Code Quality (Fast Fail)
  # ==========================================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install linting tools
        run: |
          pip install ruff black

      - name: Run Ruff (linting)
        run: |
          ruff check backend/ --output-format=github
        continue-on-error: false

      - name: Run Black (formatting check)
        run: |
          black --check --diff backend/
        continue-on-error: true  # Warning only, don't fail

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Check frontend dependencies
        working-directory: frontend
        run: |
          npm ci --silent
          npm run build --if-present

  # ==========================================================================
  # Stage 2: Docker Build (Parallel)
  # ==========================================================================
  build-backend:
    name: Build Backend Image
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: supportlens-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect supportlens-backend:test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Backend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 500 ]; then
            echo "::warning::Backend image is larger than 500MB (${SIZE_MB}MB)"
          fi

  build-frontend:
    name: Build Frontend Image
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: supportlens-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect supportlens-frontend:test --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Frontend image size: ${SIZE_MB}MB"
          if [ $SIZE_MB -gt 100 ]; then
            echo "::warning::Frontend image is larger than 100MB (${SIZE_MB}MB)"
          fi

  # ==========================================================================
  # Stage 3: End-to-End Tests
  # ==========================================================================
  e2e-test:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file
        run: |
          # Create .env without API key - tests run in degraded mode
          # This is intentional: we don't want to burn API credits in CI
          # The app gracefully degrades without the key
          cat > .env << EOF
          DATABASE_PASSWORD=supportlens123
          DATABASE_HOST=db
          DATABASE_PORT=3306
          DATABASE_NAME=supportlens
          DATABASE_USER=root
          DATABASE_TYPE=mysql
          GEMINI_API_KEY=
          DEBUG=false
          EOF

      - name: Start services
        run: |
          docker compose up -d --build
          echo "Waiting for services to be healthy..."

      - name: Wait for services
        run: |
          # Wait for backend to be healthy (up to 60 seconds)
          echo "Waiting for backend..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "Backend is healthy!"
              break
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 2
          done
          
          # Wait for frontend
          echo "Waiting for frontend..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "Frontend is healthy!"
              break
            fi
            echo "Attempt $i/15 - waiting..."
            sleep 2
          done

      - name: Run E2E tests
        run: |
          chmod +x ./scripts/e2e-test.sh
          ./scripts/e2e-test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker compose logs backend --tail=100
          echo ""
          echo "=== Database Logs ==="
          docker compose logs db --tail=50
          echo ""
          echo "=== Frontend Logs ==="
          docker compose logs frontend --tail=50

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v
